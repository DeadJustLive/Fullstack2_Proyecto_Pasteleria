server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: service-identity
          uri: ${SERVICE_IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/identity/**

        - id: service-catalog
          uri: ${SERVICE_CATALOG_URL:http://localhost:8082}
          predicates:
            - Path=/api/catalog/**

        - id: service-order
          uri: ${SERVICE_ORDER_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**

        - id: service-payment-flow
          uri: ${SERVICE_PAYMENT_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**

        - id: service-inventory
          uri: ${SERVICE_INVENTORY_URL:http://localhost:8085}
          predicates:
            - Path=/api/inventory/**

        - id: service-notification
          uri: ${SERVICE_NOTIFICATION_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
