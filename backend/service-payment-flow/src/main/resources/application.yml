server:
  port: 8084

spring:
  application:
    name: service-payment-flow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cremeco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:cremeco_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cremeco_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    consumer:
      group-id: payment-flow-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.cremeco.*"

flow:
  api-url: ${FLOW_API_URL:https://sandbox.flow.cl/api}
  api-key: ${FLOW_API_KEY:FLOW_SANDBOX_API_KEY}
  secret-key: ${FLOW_SECRET_KEY:FLOW_SANDBOX_SECRET_KEY}
  url-confirmation: ${FLOW_URL_CONFIRMATION:http://localhost:8084/api/payments/flow/confirm}
  url-return: ${FLOW_URL_RETURN:http://localhost:5173/pago/exito}
  store-url: ${STORE_URL:http://localhost:5173}
