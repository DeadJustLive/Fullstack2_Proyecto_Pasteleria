version: '3.8'

networks:
  cremeco-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  # ==============================================================================
  # BASE DE DATOS MYSQL 8
  # ==============================================================================
  mysql-db:
    image: mysql:8.0
    container_name: cremeco-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root2026_UltraSecure!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cremeco_db}
      MYSQL_USER: ${MYSQL_USER:-cremeco_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cremeco-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # BROKER KAFKA & ZOOKEEPER
  # ==============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cremeco-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cremeco-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cremeco-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - cremeco-network

  # ==============================================================================
  # CACHÉ REDIS
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: cremeco-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cremeco-network

  # ==============================================================================
  # MICROSERVICIOS SPRING BOOT
  # ==============================================================================
  service-identity:
    build:
      context: ./backend
      dockerfile: service-identity/Dockerfile
    container_name: cremeco-service-identity
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/cremeco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - cremeco-network

  service-catalog:
    build:
      context: ./backend
      dockerfile: service-catalog/Dockerfile
    container_name: cremeco-service-catalog
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/cremeco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - cremeco-network

  service-order:
    build:
      context: ./backend
      dockerfile: service-order/Dockerfile
    container_name: cremeco-service-order
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/cremeco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - cremeco-network

  service-payment-flow:
    build:
      context: ./backend
      dockerfile: service-payment-flow/Dockerfile
    container_name: cremeco-service-payment
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/cremeco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLOW_API_URL: ${FLOW_API_URL:-https://sandbox.flow.cl/api}
      FLOW_API_KEY: ${FLOW_API_KEY:-FLOW_SANDBOX_API_KEY}
      FLOW_SECRET_KEY: ${FLOW_SECRET_KEY:-FLOW_SANDBOX_SECRET_KEY}
      FLOW_URL_CONFIRMATION: ${FLOW_URL_CONFIRMATION:-http://api-gateway:8080/api/payments/flow/confirm}
      FLOW_URL_RETURN: ${FLOW_URL_RETURN:-https://pasteleriacremeco.cl/pago/exito}
      STORE_URL: ${STORE_URL:-https://pasteleriacremeco.cl}
    networks:
      - cremeco-network

  service-inventory:
    build:
      context: ./backend
      dockerfile: service-inventory/Dockerfile
    container_name: cremeco-service-inventory
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-cremeco_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - cremeco-network

  service-notification:
    build:
      context: ./backend
      dockerfile: service-notification/Dockerfile
    container_name: cremeco-service-notification
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-cremeco_db}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-cremeco_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-CremeCo2026_SecurePass!}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - cremeco-network

  # ==============================================================================
  # SPRING CLOUD API GATEWAY (Punto de entrada microservicios)
  # ==============================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: cremeco-api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - service-identity
      - service-catalog
      - service-order
      - service-payment-flow
      - service-inventory
      - service-notification
    environment:
      SERVICE_IDENTITY_URL: http://service-identity:8081
      SERVICE_CATALOG_URL: http://service-catalog:8082
      SERVICE_ORDER_URL: http://service-order:8083
      SERVICE_PAYMENT_URL: http://service-payment-flow:8084
      SERVICE_INVENTORY_URL: http://service-inventory:8085
      SERVICE_NOTIFICATION_URL: http://service-notification:8086
    networks:
      - cremeco-network
