<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Crème & Co (Validación DSY1104)</title>
  <link rel="stylesheet" href="css/auth-validacion.css">
</head>
<body>

  <header class="auth-header">
    <a href="../index.html" class="brand">🍰 Crème & Co</a>
    <span style="font-size: 0.85rem; color: #5D4037;">Maquetado de Validación DSY1104</span>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder a tus pedidos y perfil</p>

      <!-- Botonera de escenarios de prueba -->
      <div class="test-scenarios">
        <h4>⚡ Autocompletar datos de prueba (MySQL):</h4>
        <div class="test-buttons">
          <button type="button" class="btn-chip" onclick="fillLogin('cliente@cremeco.cl', 'cliente123')">🛍️ María (Cliente con Historial)</button>
          <button type="button" class="btn-chip" onclick="fillLogin('admin@cremeco.cl', 'admin123')">🧑‍💼 Administrador</button>
          <button type="button" class="btn-chip" onclick="fillLogin('pasteleria@cremeco.cl', 'pastel123')">🎂 Pastelero</button>
          <button type="button" class="btn-chip" onclick="fillLogin('despacho@cremeco.cl', 'ruta123')">🛵 Repartidor</button>
        </div>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); submitLogin();">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.cl" required>
          <div id="emailError" class="error-text" style="display: none;"></div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
          <div id="passwordError" class="error-text" style="display: none;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal; margin-bottom: 0;">
            <input type="checkbox" style="width: auto;"> Recordarme
          </label>
          <a href="#" style="color: var(--color-secondary);">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit">Ingresar a mi Cuenta</button>

        <div class="auth-footer">
          ¿Aún no tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    function fillLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }

    function submitLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      alert(`[Validación Mockup] Enviando login a /api/identity/login:\nEmail: ${email}\nPassword: ${'*'.repeat(password.length)}`);
    }
  </script>
</body>
</html>
