<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo - Crème & Co</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(93, 64, 55, 0.95), rgba(58, 42, 33, 0.98)),
                  url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 54px; height: 54px; border-radius: 50%; background: var(--color-primary); color: var(--color-tertiary); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; margin-bottom: 0.75rem;">
          C
        </div>
        <h1 style="font-size: 1.6rem; margin-bottom: 0.25rem;">Panel Administrativo</h1>
        <p style="font-size: 0.85rem; color: rgba(58, 42, 33, 0.7);">Crème & Co • Sistema de Gestión y POS</p>
      </div>

      <form action="reportes.html" method="GET" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="form-group">
          <label class="form-label">Correo Electrónico Corporativo</label>
          <input type="email" class="form-input" placeholder="admin@cremeco.cl" value="admin@cremeco.cl" required>
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-input" placeholder="••••••••••••" value="admin123" required>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
            <input type="checkbox" checked> Recordar sesión (7 días)
          </label>
          <a href="#" style="color: var(--color-secondary); font-weight: 600;">¿Olvidaste tu clave?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
          Ingresar al Panel
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
        <p style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: rgba(58, 42, 33, 0.6); margin-bottom: 0.75rem; text-align: center;">
          Perfiles Demo Rápidos (RBAC)
        </p>
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
          <a href="reportes.html" class="btn btn-outline btn-sm" style="font-size: 0.75rem;">Admin General</a>
          <a href="productos.html" class="btn btn-outline btn-sm" style="font-size: 0.75rem;">Jefe Cocina</a>
          <a href="inventario.html" class="btn btn-outline btn-sm" style="font-size: 0.75rem;">Cajero POS</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
