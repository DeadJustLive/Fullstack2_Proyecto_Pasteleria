<!-- 
  PLANTILLA BASE PARA PROTOTIPOS (PRE-REACT)
  Usa esta estructura cuando la IA te genere un componente.
  Guarda el archivo en: /src_html/components/nombre_componente.html 
-->

<!-- BLOCK PRINCIPAL DEL COMPONENTE (BEM) -->
<article class="nombre-componente">
    
    <!-- STATE: if (isLoading) render skeleton loader -->
    
    <header class="nombre-componente__header">
        <!-- PROPS: title -->
        <h2 class="nombre-componente__title">Título de Ejemplo</h2>
    </header>

    <div class="nombre-componente__body">
        <!-- PROPS: description -->
        <p class="nombre-componente__text">Descripción o contenido generado por la IA irá aquí.</p>
    </div>

    <footer class="nombre-componente__footer">
        <!-- ACTION: onClick="handleAction()" -->
        <button class="nombre-componente__btn nombre-componente__btn--primary">
            Acción Principal
        </button>
    </footer>

</article>

<!-- NOTA: El CSS debe ir en un archivo separado en /src_html/css/ -->
