<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Punto de Venta | Admin</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Local CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin-variables.css">
  <link rel="stylesheet" href="css/admin-sidebar.css">
  <link rel="stylesheet" href="css/admin-header.css">
  <link rel="stylesheet" href="css/admin-bottom-nav.css">
  <link rel="stylesheet" href="css/admin-feedback.css">
  <link rel="stylesheet" href="css/admin-pos.css">
  <link rel="stylesheet" href="css/admin-cards.css">
  <script>if (localStorage.getItem('admin_sidebar_compact') === 'true') document.documentElement.classList.add('is-sidebar-compact');</script>
  <link rel="stylesheet" href="../../css/dev-hub-button.css">
</head>

<body>
  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- SIDEBAR will be injected here -->
  <div id="sidebar-placeholder"></div>

  <div class="main-content" id="main-content">
    <!-- HEADER will be injected here -->
    <div id="header-placeholder"></div>

    <main class="admin-main-area pb-4">
      <div class="container-fluid px-3 px-md-4">
        <div class="mb-4 mt-2">
          <h1 class="fw-bold" style="font-size: 2rem;">Punto de Venta</h1>
          <p class="text-muted m-0" style="opacity: 0.8;">Registra nuevas ventas rápidamente.</p>
        </div>

        <div class="row g-3">
          <!-- Col: Product Grid (Full Width) -->
          <div class="col-12">
            <div class="mb-3 d-flex gap-2 overflow-auto category-filters">
              <button class="btn btn-primary rounded-pill px-4 filter-btn" data-category="all">Todos</button>
              <button class="btn btn-outline-primary rounded-pill px-4 filter-btn"
                data-category="pasteleria">Pastelería</button>
              <button class="btn btn-outline-primary rounded-pill px-4 filter-btn"
                data-category="bebidas">Bebidas</button>
              <button class="btn btn-outline-primary rounded-pill px-4 filter-btn"
                data-category="panaderia">Panadería</button>
            </div>

            <div class="row g-3 product-grid">
              <!-- Products will be generated by JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- BOTTOM NAV will be injected here -->
  <div id="bottomnav-placeholder"></div>

  <!-- Floating Cart Button -->
  <button class="btn btn-primary floating-cart-btn shadow-lg" data-bs-toggle="modal" data-bs-target="#modalCarrito">
    <i class="bi bi-cart3 me-1"></i> Ver Carrito
    <span class="badge bg-danger rounded-pill ms-2" id="floating-cart-badge">0</span>
  </button>

  <!-- Modal Carrito -->
  <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius: 16px; border: none; height: 80vh;">
        <div class="modal-header" style="border-bottom: 1px solid rgba(147,75,25,0.1); background-color: #f8f5f1;">
          <h5 class="modal-title fw-bold" id="modalCarritoLabel" style="color: var(--bs-secondary); font-family: var(--admin-font-heading);">Ticket Actual</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3 d-flex flex-column" style="background-color: var(--bs-surface-white); padding-left: 4px; padding-right: 4px;">
          <div class="cart-items flex-grow-1 overflow-auto d-flex flex-column" id="cart-items">
            <!-- Cart items here -->
            <div class="text-center text-muted m-auto empty-cart-msg">
              El carrito está vacío.
            </div>
          </div>
        </div>
        <div class="modal-footer flex-column align-items-stretch" style="border-top: 1px solid rgba(147,75,25,0.1); background-color: var(--bs-surface-white);">
          <div class="d-flex justify-content-between mb-2 text-muted">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-3 fw-bold fs-5" style="color: var(--bs-primary);">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <button class="btn btn-primary w-100 py-2 fs-5 fw-bold" id="btn-cobrar" data-bs-toggle="modal" data-bs-target="#modalMetodoPago" disabled>
            COBRAR
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Método de Pago -->
  <div class="modal fade" id="modalMetodoPago" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 16px; border: none;">
        <div class="modal-header" style="border-bottom: 1px solid rgba(147,75,25,0.1); background-color: #f8f5f1;">
          <h5 class="modal-title fw-bold" style="color: var(--bs-secondary); font-family: var(--admin-font-heading);">
            Método de Pago</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <div class="d-grid gap-3">
            <button class="btn btn-outline-secondary py-3 payment-method-btn" data-method="efectivo">
              <i class="bi bi-cash fs-3 d-block mb-2"></i> Efectivo
            </button>
            <button class="btn btn-outline-secondary py-3 payment-method-btn" data-method="tarjeta">
              <i class="bi bi-credit-card fs-3 d-block mb-2"></i> Tarjeta / Débito
            </button>
            <button class="btn btn-outline-secondary py-3 payment-method-btn" data-method="transferencia">
              <i class="bi bi-phone fs-3 d-block mb-2"></i> Transferencia
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Venta Exitosa -->
  <div class="modal fade" id="modalVentaExitosa" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 16px; border: none;">
        <div class="modal-body p-5 text-center">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
          <h3 class="fw-bold mt-3 mb-2" style="color: var(--bs-secondary);">¡Venta Exitosa!</h3>
          <p class="text-muted mb-4">El pago ha sido procesado correctamente.</p>
          <button type="button" class="btn btn-primary rounded-pill px-5 py-2" id="btn-nueva-venta"
            data-bs-dismiss="modal">
            Nueva Venta
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Local JS -->
  <script src="js/sidebar-toggle.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/pos-interactivity.js"></script>

<!-- Dev Hub Button -->
<a href="../../index.html" class="dev-btn-volver-hub" title="Volver al índice">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  Volver al Hub
</a>

</body>

</html>
